<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Averion Engineering Enterprises</title>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

:root{
    --charcoal:#2C2C2C;
    --grey:#A9A9A9;
    --sand:#F5F5DC;
    --copper:#B87333;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Montserrat',sans-serif;
    background:#111;
    color:white;
    overflow:hidden;
    height:100vh;
}

body::before{
    content:'';
    position:absolute;
    width:200%;
    height:200%;
    background:
    radial-gradient(circle at center,
    rgba(184,115,51,.15),
    transparent 40%);
    animation:rotate 30s linear infinite;
}

.grid{
    position:absolute;
    inset:0;
    background-image:
    linear-gradient(rgba(255,255,255,.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,.03) 1px, transparent 1px);
    background-size:60px 60px;
}

.container{
    position:relative;
    z-index:2;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
    padding:20px;
}

.content{
    max-width:800px;
    animation:fadeUp 1.5s ease;
}

.logo{
    font-size:18px;
    letter-spacing:8px;
    color:var(--copper);
    margin-bottom:20px;
    text-transform:uppercase;
}

h1{
    font-size:clamp(3rem,8vw,6rem);
    font-weight:700;
    color:white;
    margin-bottom:20px;
}

.tagline{
    color:var(--sand);
    font-size:1.1rem;
    letter-spacing:4px;
    text-transform:uppercase;
    margin-bottom:30px;
}

.desc{
    font-size:1.2rem;
    color:#d0d0d0;
    line-height:1.8;
    margin-bottom:40px;
}

.line{
    width:120px;
    height:3px;
    margin:0 auto 40px;
    background:var(--copper);
    box-shadow:0 0 20px var(--copper);
}

.badge{
    display:inline-block;
    padding:14px 30px;
    border:1px solid var(--copper);
    color:var(--copper);
    text-transform:uppercase;
    letter-spacing:3px;
    transition:.4s;
}

.badge:hover{
    background:var(--copper);
    color:white;
}

.footer{
    position:absolute;
    bottom:30px;
    width:100%;
    text-align:center;
    color:#aaa;
    font-size:.9rem;
    letter-spacing:2px;
}

@keyframes fadeUp{
    from{
        opacity:0;
        transform:translateY(40px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

@keyframes rotate{
    from{
        transform:rotate(0deg);
    }
    to{
        transform:rotate(360deg);
    }
}

</style>
</head>

<body>

<div class="grid"></div>

<div class="container">
    <div class="content">

        <div class="logo">
            AVERION
        </div>

        <h1>COMING SOON</h1>

        <div class="line"></div>

        <div class="tagline">
            Engineering • Innovation • Excellence
        </div>

        <p class="desc">
            We are crafting a premium digital experience that reflects
            our commitment to engineering excellence, innovative solutions,
            and exceptional project delivery.
        </p>

        <div class="badge">
            Launching Soon
        </div>

    </div>
</div>

<div class="footer">
    © 2026 Averion Engineering Enterprises
</div>

</body>
</html>
